<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
<meta name="referrer" content="no-referrer"/>
<title>PicReview · Demo</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f5;color:#222;min-height:100vh}
header{background:#1a73e8;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header h1{font-size:1.2rem;flex:1;cursor:pointer}
#roleLabel{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 6px 4px 14px;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#logoutBtn{background:#fff;color:#1a73e8;border:none;border-radius:20px;padding:5px 14px;cursor:pointer;font-size:.85rem;font-weight:600}
main{padding:24px}
.back-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.btn-back{background:#fff;border:2px solid #1a73e8;color:#1a73e8;border-radius:20px;padding:6px 18px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn-back:hover{background:#e8f0fe}
.btn-import-table{background:#1a73e8;color:#fff;border:none;border-radius:20px;padding:6px 18px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn-import-table:hover{background:#1558b0}
.btn-import-table.secondary{background:#fff;color:#666;border:2px solid #ccc;padding:4px 14px;font-weight:500}
.btn-import-table.secondary:hover{border-color:#dc3545;color:#dc3545}
.project-title{font-size:1.2rem;font-weight:700}
.projects-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.projects-header h2{font-size:1.1rem;font-weight:700}
.btn-new-folder{background:#1a73e8;color:#fff;border:none;border-radius:20px;padding:6px 18px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn-new-folder:hover{background:#1558b0}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.folder-card{background:#fff;border-radius:12px;padding:20px 18px;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px}
.folder-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.folder-card .folder-icon{font-size:2rem}
.folder-card .folder-name{font-weight:700;font-size:1rem;word-break:break-all}
.folder-card .folder-meta{font-size:.78rem;color:#888}
.folder-card .folder-stats{display:flex;gap:6px;flex-wrap:wrap}
.folder-card{position:relative}
.folder-card.completed{opacity:.55;filter:grayscale(.5)}
.folder-card.completed:hover{opacity:.75}
.completed-badge{position:absolute;top:10px;right:10px;background:#2e7d32;color:#fff;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.5px}
.proj-filter-bar{display:flex;gap:6px;margin-bottom:14px}
.proj-filter-bar button{padding:4px 14px;border-radius:20px;border:1px solid #c8d3e8;background:#f5f7fb;color:#555;cursor:pointer;font-size:.85rem;transition:background .15s}
.proj-filter-bar button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.btn-complete{padding:4px 12px;border-radius:6px;border:1px solid #2e7d32;background:#e8f5e9;color:#2e7d32;cursor:pointer;font-size:.82rem;font-weight:600;transition:background .15s}
.btn-complete:hover{background:#c8e6c9}
.btn-complete.is-completed{border-color:#b0bec5;background:#f5f5f5;color:#888}
.projects-search{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.projects-search input{flex:1;min-width:160px;padding:8px 14px;border:1px solid #ccc;border-radius:20px;font-size:.9rem;font-family:inherit}
.projects-search input:focus{outline:none;border-color:#1a73e8}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar button{padding:6px 18px;border:2px solid #ccc;background:#fff;border-radius:20px;cursor:pointer;font-size:.88rem;transition:all .15s}
.filter-bar button.active,.filter-bar button:hover{border-color:#1a73e8;color:#1a73e8;background:#e8f0fe}
#statsBar{margin-left:auto;font-size:.85rem;color:#666}
#copyToast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 24px;border-radius:20px;font-size:.9rem;pointer-events:none;opacity:0;transition:opacity .25s;z-index:999999;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#uploadArea{border:2px dashed #1a73e8;border-radius:12px;padding:28px;text-align:center;margin-bottom:28px;background:#fff;cursor:pointer;transition:background .15s}
#uploadArea:hover{background:#e8f0fe}
#uploadArea p{color:#555;margin-top:8px;font-size:.9rem}
#fileInput{display:none}
#uploadProgress{margin-top:10px;height:8px;background:#e0e0e0;border-radius:4px;display:none}
#uploadProgress .bar{height:100%;background:#1a73e8;border-radius:4px;width:0;transition:width .15s}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card-wrap{position:relative}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.card-wrap.select-mode .card{outline:2px solid transparent}
.card-wrap.selected .card{outline:3px solid #1a73e8}
.card-sel{display:none;position:absolute;top:8px;right:8px;z-index:8}
.card-wrap.select-mode .card-sel{display:block}
.card-sel input{width:18px;height:18px;cursor:pointer}
.claim-pin{position:absolute;top:8px;left:8px;z-index:7;color:#fff;padding:4px 10px;border-radius:10px;font-size:.72rem;font-weight:800;max-width:calc(100% - 48px);text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.claim-pin em,.modal-claim-pin em{font-style:italic;font-weight:800}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.batch-bar{display:none;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;background:#fff;border-radius:12px;border:1px solid #dee2e6}
.batch-bar.visible{display:flex}
.batch-bar label{display:flex;align-items:center;gap:6px;font-size:.88rem;cursor:pointer}
.batch-bar button{padding:6px 16px;border-radius:20px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;background:#e9ecef}
.batch-bar button.primary{background:#1a73e8;color:#fff}
.batch-bar button.danger{background:#dc3545;color:#fff}
#batchCount{margin-left:auto;font-size:.85rem;color:#555}
.modal-claim-pin{position:absolute;top:10px;left:10px;z-index:15;color:#fff;padding:5px 12px;border-radius:10px;font-size:.8rem;font-weight:800;display:none;max-width:85%;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.modal-claim-pin.show{display:block}
.btn-claim{padding:8px 18px;background:#ff9800;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:700}
.btn-claim:hover{background:#f57c00}
.btn-claim-secondary{padding:8px 14px;background:#fff;color:#666;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:.85rem}
.card .info{padding:10px 12px}
.card .filename{font-size:.78rem;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;border-radius:12px;padding:2px 10px;font-size:.73rem;font-weight:700;margin-bottom:4px}
.badge-pending{background:#fff3cd;color:#856404}
.badge-approved{background:#d1e7dd;color:#0f5132}
.badge-rejected{background:#f8d7da;color:#842029}
.badge-claimed{background:#fff3e0;color:#e65100}
.card .reject-reason{font-size:.73rem;color:#842029;margin-top:4px;word-break:break-all}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
.modal-box{background:#fff;border-radius:16px;max-width:920px;width:100%;max-height:96vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-img-wrap{
  background:#111;border-radius:16px 16px 0 0;overflow:auto;display:flex;align-items:center;justify-content:center;position:relative;
  flex-shrink:0;min-height:0;padding:8px;box-sizing:border-box;
  max-height:min(82vh,calc(100dvh - 200px));
}
.modal-img-wrap img{
  max-width:100%;width:auto;height:auto;object-fit:contain;display:block;
  max-height:min(82vh,calc(100dvh - 200px));
}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav-btn:hover{background:#fff}
.nav-btn:disabled{opacity:.2;cursor:default}
#btnPrev{left:10px}#btnNext{right:10px}
#navCounter{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:#fff;border-radius:12px;padding:2px 12px;font-size:.8rem}
#reviewToast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);padding:14px 36px;border-radius:12px;font-size:1.2rem;font-weight:800;color:#fff;pointer-events:none;opacity:0;transition:opacity .3s;z-index:100001;box-shadow:0 4px 24px rgba(0,0,0,.4);letter-spacing:.05em}
#reviewToast.show{opacity:1}
#reviewToast.approved{background:rgba(25,135,84,.93)}
#reviewToast.rejected{background:rgba(220,53,69,.93)}
.modal-body{padding:18px 22px 22px}
.modal-body h3{margin-bottom:6px;font-size:1rem;word-break:break-all}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{padding:4px 12px;border:2px solid #ccc;border-radius:20px;cursor:pointer;font-size:.82rem;transition:all .15s;background:#fff}
.tag.selected{border-color:#1a73e8;background:#e8f0fe;color:#1a73e8;font-weight:700}
.modal-body textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px;font-size:.88rem;resize:vertical;min-height:60px;font-family:inherit;margin-bottom:14px}
.modal-body textarea:focus{outline:none;border-color:#1a73e8}
.comments-list{margin-bottom:14px;max-height:140px;overflow-y:auto}
.comment-item{background:#f8f9fa;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:.83rem}
.comment-item .meta{color:#888;font-size:.73rem;margin-bottom:3px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-approve{padding:8px 22px;background:#198754;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.92rem;font-weight:700}
.btn-approve:hover{background:#157347}
.btn-reject{padding:8px 22px;background:#dc3545;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.92rem;font-weight:700}
.btn-reject:hover{background:#bb2d3b}
.btn-close{padding:8px 18px;background:#e9ecef;color:#333;border:none;border-radius:8px;cursor:pointer;font-size:.92rem}
.btn-close:hover{background:#dee2e6}
.btn-delete{padding:8px 18px;background:#fff;color:#dc3545;border:2px solid #dc3545;border-radius:8px;cursor:pointer;font-size:.92rem;margin-right:auto}
.btn-delete:hover{background:#f8d7da}
.replaceBtn{width:100%;margin-top:8px;padding:7px;background:#dc3545;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600}
.btn-rename{background:none;border:none;cursor:pointer;color:#aaa;font-size:.85rem;padding:0 4px;vertical-align:middle;line-height:1}
.btn-rename:hover{color:#1a73e8}
#importModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center}
#importModal.open{display:flex}
.import-box{background:#fff;border-radius:16px;padding:28px 30px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.import-box h2{font-size:1.05rem;margin:0 0 18px;color:#1a1a1a}
.import-section{margin-bottom:18px}
.import-section label{display:block;font-size:.82rem;font-weight:700;color:#555;margin-bottom:6px}
.import-section select{width:100%;padding:7px 10px;border:1px solid #ccc;border-radius:8px;font-size:.88rem;background:#fff}
.import-col-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:160px;overflow-y:auto;padding:4px 0}
.import-col-item{display:flex;align-items:center;gap:6px;font-size:.82rem;padding:4px 8px;border-radius:6px;background:#f8f9fa}
.import-col-item input{flex-shrink:0}
.import-col-item.empty-col{opacity:.4}
.import-preview{background:#f8f9fa;border-radius:8px;padding:10px 12px;font-size:.78rem;color:#555;margin-bottom:18px;max-height:80px;overflow:hidden;line-height:1.7}
.import-actions{display:flex;gap:10px;justify-content:flex-end}
.import-actions button{padding:8px 22px;border-radius:8px;border:none;cursor:pointer;font-size:.88rem;font-weight:700}
.btn-import-confirm{background:#1a73e8;color:#fff}
.btn-import-confirm:hover{background:#1558b0}
.btn-import-cancel{background:#e9ecef;color:#333}
.btn-import-cancel:hover{background:#dee2e6}
.toast{background:#323232;color:#fff;border-radius:12px;padding:13px 18px;font-size:.88rem;box-shadow:0 4px 20px rgba(0,0,0,.35);pointer-events:all;display:flex;align-items:flex-start;gap:10px;max-width:320px;line-height:1.5;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-close{background:none;border:none;color:#fff;cursor:pointer;font-size:1.1rem;padding:0;opacity:.6;flex-shrink:0;margin-left:auto}
.toast-close:hover{opacity:1}
#emptyHint{text-align:center;color:#aaa;margin-top:60px;font-size:1rem}
.view-btn{padding:6px 18px;border:2px solid #ccc;background:#fff;border-radius:20px;cursor:pointer;font-size:.88rem;transition:all .15s;font-family:inherit}
.view-btn.active,.view-btn:hover{border-color:#1a73e8;color:#1a73e8;background:#e8f0fe}
#tableView{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:20px;display:none}
#statusTable{width:100%;border-collapse:collapse;font-size:.85rem}
#statusTable th{background:#f0f2f5;padding:10px 14px;text-align:left;font-weight:700;border-bottom:2px solid #dee2e6;white-space:nowrap}
#statusTable td{padding:7px 14px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
#statusTable tr:hover td{background:#f8f9fa;cursor:pointer}
.st-badge{border-radius:10px;padding:2px 10px;font-size:.76rem;font-weight:700;white-space:nowrap}
.book-header td{background:#1a73e8;color:#fff;font-weight:700;padding:8px 16px;font-size:.88rem}
#loginMask{position:fixed;inset:0;background:linear-gradient(135deg,#1a73e8 0%,#0d47a1 100%);display:flex;align-items:center;justify-content:center;z-index:200}
.login-box{background:#fff;border-radius:16px;padding:40px 36px;width:360px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.login-box h2{margin-bottom:6px;font-size:1.4rem;color:#1a73e8}
.login-box .sub{color:#666;margin-bottom:22px;font-size:.9rem}
.login-box input{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px 14px;font-size:1rem;margin-bottom:6px;font-family:inherit}
.login-box input:focus{outline:none;border-color:#1a73e8}
.login-box .login-hint{margin:0 0 12px;font-size:.74rem;color:#999;letter-spacing:.02em}
.role-pick{display:flex;gap:12px;margin-bottom:22px}
.role-card{flex:1;border:2px solid #e0e0e0;border-radius:14px;padding:18px 10px 14px;cursor:pointer;transition:all .2s;text-align:center;position:relative;background:#fafafa}
#cardUploader{border-color:#b3d4fb}
#cardUploader:hover{border-color:#1a73e8;background:#eef5ff;box-shadow:0 4px 16px rgba(26,115,232,.15);transform:translateY(-2px)}
#cardUploader.selected{border-color:#1a73e8;background:#e8f0fe;box-shadow:0 4px 16px rgba(26,115,232,.22);transform:translateY(-2px)}
#cardReviewer{border-color:#a3d9b8}
#cardReviewer:hover{border-color:#198754;background:#edf7f2;box-shadow:0 4px 16px rgba(25,135,84,.15);transform:translateY(-2px)}
#cardReviewer.selected{border-color:#198754;background:#d7f0e3;box-shadow:0 4px 16px rgba(25,135,84,.22);transform:translateY(-2px)}
.role-icon-wrap{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:1.5rem;transition:transform .2s}
#cardUploader .role-icon-wrap{background:#dbeafe}
#cardReviewer .role-icon-wrap{background:#d1fae5}
.role-card:hover .role-icon-wrap,.role-card.selected .role-icon-wrap{transform:scale(1.12)}
.role-card .name{font-weight:700;font-size:1rem;margin-bottom:4px}
#cardUploader .name{color:#1558b0}
#cardReviewer .name{color:#146c43}
.role-card .desc{font-size:.72rem;color:#999;line-height:1.5}
.role-check{position:absolute;top:9px;right:9px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:900;opacity:0;transition:opacity .15s}
#cardUploader.selected .role-check{opacity:1;background:#1a73e8;color:#fff}
#cardReviewer.selected .role-check{opacity:1;background:#198754;color:#fff}
.login-box button{width:100%;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
.login-box button:hover{background:#1558b0}
.role-badge-uploader{background:#dbeafe;color:#1558b0;border-radius:12px;padding:2px 9px;font-size:.78rem;font-weight:700}
.role-badge-reviewer{background:#d1fae5;color:#146c43;border-radius:12px;padding:2px 9px;font-size:.78rem;font-weight:700}
</style>
</head>
<body>
<div id="loginMask">
  <div class="login-box">
    <h2>PicReview · Demo</h2>
    <p class="sub"></p>
    <input id="nameInput" type="text" placeholder="例：访客" maxlength="20"/>
    <p class="login-hint">1. 输入名字  ·  2. 选择角色  ·  3. 进入</p>
    <div class="role-pick">
      <div class="role-card" id="cardUploader" data-role="uploader"><div class="role-check">✓</div><div class="role-icon-wrap">📤</div><div class="name">上传</div><div class="desc">上传 / 删除 / 替换</div></div>
      <div class="role-card" id="cardReviewer" data-role="reviewer"><div class="role-check">✓</div><div class="role-icon-wrap">🔍</div><div class="name">审核</div><div class="desc">通过 / 打回 / 评论</div></div>
    </div>
    <button id="enterBtn">进入</button>
  </div>
</div>
<header>
  <h1 id="headerTitle" title="返回项目列表">PicReview Demo</h1>
  <span id="roleLabel"></span>
  <button id="logoutBtn">切换</button>
  <button id="resetBtn" onclick="if(confirm('确定重置？所有操作将清空，恢复初始示例数据。')){localStorage.removeItem('reviewUser');localStorage.removeItem('reviewRole');localStorage.removeItem('lastVisit');location.reload();}" style="background:#f59e0b;color:#fff;border:none;border-radius:20px;padding:5px 14px;cursor:pointer;font-size:.85rem;font-weight:600">重置演示</button>
</header>
<main>
  <!-- Project list view -->
  <div id="projectsView">
    <div class="projects-header">
      <h2>📁 全部项目</h2>
      <button class="btn-new-folder" id="btnNewFolder">+ 新建项目</button>
    </div>
    <div class="proj-filter-bar">
      <button class="active" data-pf="all">全部</button>
      <button data-pf="active">进行中</button>
      <button data-pf="completed">已完成</button>
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </div>
  <!-- Image view -->
  <div id="imagesView" style="display:none">
    <div class="back-bar">
      <button class="btn-back" id="btnBack">← 返回</button>
      <span class="project-title" id="projectTitle"></span>
      <button class="btn-import-table" id="btnImportTable" style="margin-left:auto" title="支持 .xlsx / .xls / .csv，可选 Sheet、ID 列和显示列">📥 导入表格 (.xlsx/.xls/.csv)</button>
      <button class="btn-import-table secondary" id="btnClearTable" style="display:none" title="清空当前项目的表格">清空</button>
      <button class="btn-complete" id="btnComplete" style="display:none">✓ 标记完结</button>
      <input type="file" id="tableFileInput" accept=".csv,.txt,.xlsx,.xls" style="display:none"/>
    </div>
    <div class="projects-search" id="imgSearchBar">
      <input id="imgSearch" type="text" placeholder="搜索文件名…">
    </div>
    <div id="uploadArea">
      <div style="font-size:2.5rem">📤</div>
      <p><strong>点击或拖拽图片到此处上传</strong></p>
      <p>支持 JPG / PNG / WEBP，可多选批量上传</p>
      <input id="fileInput" type="file" accept="image/*" multiple/>
      <div id="uploadProgress"><div class="bar" id="progressBar"></div></div>
      <p id="uploadStatus" style="margin-top:6px;font-size:.85rem;color:#555"></p>
    </div>

async function fetchAllRows(buildQuery){
  const pageSize=1000;let from=0,all=[];
  while(true){
    const{data,error}=await buildQuery().range(from,from+pageSize-1);
    if(error)throw error;
    if(!data||!data.length)break;
    all=all.concat(data);
    if(data.length<pageSize)break;
    from+=pageSize;
  }
  return all;
}

function parseCsv(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(c==='"')inQ=false;
      else cell+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(cell);cell="";}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
      else if(c!=='\r')cell+=c;
    }
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  return rows;
}

let _impWb=null,_impAllSheets={};

function _impEmptyRatio(rows,colIdx){
  let empty=0;
  const body=rows.slice(1);
  body.forEach(r=>{if(!(r[colIdx]||"").trim())empty++;});
  return body.length?empty/body.length:1;
}

function _impResolveCell(cell){
  if(cell==null)return"";
  // Use cached value directly
  if(cell.v!=null&&cell.v!=="")return String(cell.v);
  // Cross-sheet formula reference: ='SheetName'!B2 or =SheetName!B2
  if(cell.f){
    const m=cell.f.match(/^='?([^'!\r\n]+)'?!([A-Z]+\d+)$/i);
    if(m&&_impWb){
      const refWs=_impWb.Sheets[m[1]];
      if(refWs){const rc=refWs[m[2]];if(rc&&rc.v!=null)return String(rc.v);}
    }
  }
  return"";
}

function _impSheetRows(sheetName){
  if(!_impWb)return[];
  const ws=_impWb.Sheets[sheetName];
  if(!ws)return[];
  const ref=ws["!ref"];
  if(!ref)return[];
  const range=XLSX.utils.decode_range(ref);
  const rows=[];
  for(let R=range.s.r;R<=range.e.r;R++){
    const row=[];
    for(let C=range.s.c;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      row.push(_impResolveCell(ws[addr]||null));
    }
    rows.push(row);
  }
  return rows;
}

function _impUpdateCols(){
  const sheetName=document.getElementById("impSheetSelect").value;
  const rows=_impSheetRows(sheetName).filter(r=>r.some(c=>(c||"").trim()));
  if(!rows.length)return;
  const header=rows[0].map((c,i)=>(c||"").trim()||(i===0?"(第1列)":"列"+(i+1)));
  const maxCols=Math.max(...rows.map(r=>r.length));

  // Calculate empty ratio per column
  const empties=header.map((_,i)=>_impEmptyRatio(rows,i));

  // ID column: prefer columns with names containing output filename/ID/serial number/key
  const keySel=document.getElementById("impKeySelect");
  keySel.innerHTML=header.map((h,i)=>`<option value="${i}" ${empties[i]>0.8?"style='opacity:.4'":""}>${h}${empties[i]>0.8?" (mostly empty)":""}</option>`).join("");
  const autoKey=header.findIndex(h=>/output.*name|serial|number|^id$|^key$/i.test(h));
  keySel.value=autoKey>=0?autoKey:0;
  keySel.onchange=_impRefreshPreview;

  // Display columns: exclude empty columns and ID column
  const list=document.getElementById("impColList");
  list.innerHTML=header.map((h,i)=>`
    <label class="import-col-item${empties[i]>0.8?' empty-col':''}">
      <input type="checkbox" data-col="${i}" ${i!==+keySel.value&&empties[i]<=0.8?"checked":""} />
      ${h}${empties[i]>0.8?" 🚫":""}
    </label>`).join("");
  list.querySelectorAll("input").forEach(cb=>{
    cb.addEventListener("change",_impRefreshPreview);
  });
  keySel.onchange=()=>{
    // Deselect new key column, select original key column
    list.querySelectorAll("input").forEach(cb=>{
      const ci=+cb.dataset.col;
      if(ci===+keySel.value)cb.checked=false;
    });
    _impRefreshPreview();
  };
  _impRefreshPreview();
}

async function hashFile(file){const buf=await file.arrayBuffer();const h=await crypto.subtle.digest("SHA-256",buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");}
async function handleFiles(files){
  const imgs=files.filter(f=>f.type.startsWith("image/"));if(!imgs.length)return;
  uploadProgress.style.display="block";
  let done=0,skipped=0,replaced=0,inserted=0;const total=imgs.length;
  const pid=currentProjectId==="__uncat__"?null:currentProjectId;
  async function uploadOne(f){
    const hash=await hashFile(f);
    let qn=sb.from("images").select("id").eq("filename",f.name).limit(1);
    if(pid===null)qn=qn.is("project_id",null);else qn=qn.eq("project_id",pid);
    const{data:sameName}=await qn;
    if(sameName&&sameName.length){
      try{
        const j=await cldUpload(f);
        await sb.from("images").update({url:j.secure_url,storage_path:j.public_id,file_hash:hash,status:"pending",updated_at:new Date().toISOString(),uploader:currentUser,replaced_by:currentUser,reject_reason:"",tags:[],claimed_by:null,claimed_at:null}).eq("id",sameName[0].id);
        replaced++;
      }catch(err){console.error(err);}
      done++;progressBar.style.width=(done/total*100)+"%";
      uploadStatus.textContent="处理中 "+done+" / "+total+"（同名替换）";
      return;
    }
    const{data:byHash}=await sb.from("images").select("id,filename").eq("file_hash",hash).limit(1);
    if(byHash&&byHash.length){skipped++;done++;progressBar.style.width=(done/total*100)+"%";uploadStatus.textContent="跳过重复："+f.name;return;}
    try{
      const j=await cldUpload(f);
      await sb.from("images").insert({url:j.secure_url,storage_path:j.public_id,filename:f.name,file_hash:hash,uploader:currentUser,status:"pending",tags:[],comments:[],project_id:pid,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});
      inserted++;
    }catch(err){console.error(err);uploadStatus.textContent="上传失败："+f.name+" "+err.message;}
    done++;progressBar.style.width=(done/total*100)+"%";uploadStatus.textContent="上传中 "+done+" / "+total;
  }
  for(let i=0;i<imgs.length;i+=4)await Promise.allSettled(imgs.slice(i,i+4).map(uploadOne));
  uploadStatus.textContent="完成：新上传 "+inserted+"，同名替换 "+replaced+(skipped>0?"，跳过 "+skipped:"");
  if(inserted+replaced>=3)await recordUploadNotification(inserted+replaced);
  setTimeout(()=>{uploadProgress.style.display="none";progressBar.style.width="0";uploadStatus.textContent="";},4500);
  fileInput.value="";
}

function parseImgName(fn){
  const base=(fn||"").replace(/\.[^.]+$/,"");
  const parts=base.split("_");
  const lvM=parts[0]&&parts[0].match(/L(\d+)/i);
  const lv=lvM?parseInt(lvM[1]):99;
  const lastPart=(parts[parts.length-1]||"").trim();
  let scene;
  if(lastPart==="Cover"||lastPart.toLowerCase()==="cover")scene=-1;
  else if(lastPart==="Back"||/^back.?cover$/i.test(lastPart))scene=99999;
  else{const scM=lastPart.match(/\d+/);scene=scM?parseInt(scM[0]):0;}
  const book=parts.length>=2?parts.slice(1,-1).join("_"):"";
  return{lv,book,scene};
}
function sortImages(docs){
  const isEng=currentProjectName&&currentProjectName.includes("English picture book");
  if(isEng){
    return[...docs].sort((a,b)=>{
      const pa=parseImgName(a.filename),pb=parseImgName(b.filename);
      const bc=pa.book.localeCompare(pb.book,"en");
      if(bc!==0)return bc;
      return pa.scene-pb.scene;
    });
  }
  return[...docs].sort((a,b)=>(b.filename||"").localeCompare(a.filename||""));
}

function copyIds(){
  const ids=[...document.querySelectorAll("#statusTbody tr")]
    .filter(tr=>!tr.classList.contains("book-header"))

  if(!ids){showCopyToast("没有可复制的序号");return;}
  const n=ids.split(" ").length;
  function execFallback(){
    try{
      const ta=document.createElement("textarea");
      ta.value=ids;ta.style.cssText="position:fixed;top:0;left:0;width:1em;height:1em;padding:0;border:0;opacity:0";
      document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ids.length);
      const ok=document.execCommand("copy");document.body.removeChild(ta);
      console.log("[copyIds] execCommand result:",ok);
      if(ok){showCopyToast("已复制 "+n+" 个序号");}
      else{window.prompt("自动复制失败，请按 Ctrl+C 手动复制：",ids);}
    }catch(e){console.error("[copyIds] fallback error:",e);window.prompt("Copy failed, please copy manually:",ids);}
  }
  if(navigator.clipboard){
    navigator.clipboard.writeText(ids)
      .then(()=>{console.log("[copyIds] clipboard API success");showCopyToast("已复制 "+n+" 个序号");})
      .catch(err=>{console.warn("[copyIds] clipboard API failed, using fallback:",err);execFallback();});

      else{
        const kw=fn.split(/[_\-\s]/)[0].toLowerCase();
        if(kwToId[kw])id=kwToId[kw];
      }
      if(id){if(!docMap[id])docMap[id]=[];docMap[id].push(d);}
    });
    let shown=0;
    Object.keys(WORD_MAP).sort().forEach(id=>{
      const row=WORD_MAP[id];
      const docs=docMap[id]||[];
      const ist=docs.length===0?"none":docs.every(d=>itemStatus(d)==="approved")?"approved":docs.some(d=>itemStatus(d)==="rejected"&&!d.claimed_by)?"rejected":docs.some(d=>itemStatus(d)==="claimed")?"claimed":docs.some(d=>d.status==="pending")?"pending":"none";
      if(activeFilter!=="all"&&activeFilter!==ist)return;
      if(searchQ&&!id.includes(searchQ)&&!row.kw.toLowerCase().includes(searchQ)&&!row.zh.includes(searchQ))return;
      const c=stColors[ist]||stColors.none;
      const stText=ist==="none"?"未上传":statusLabel(ist);
      const tr=document.createElement("tr");
      tr.innerHTML="<td style=\"color:#888;font-size:.8rem\">"+id+"</td><td style=\"font-weight:700\">"+row.kw+"</td><td style=\"font-size:.78rem;color:#555\">"+row.zh+"</td><td style=\"text-align:center\">"+(row.i12?"✓":"")+"</td><td style=\"text-align:center\">"+(row.i18?"✓":"")+"</td><td style=\"text-align:center\">"+(row.i25?"✓":"")+"</td><td><span class=\"st-badge\" style=\"background:"+c.bg+";color:"+c.fg+"\">"+stText+"</span></td>";
      if(docs.length){tr.style.cursor="pointer";tr.addEventListener("click",()=>openModal(docs[0],docs));}
      tbody.appendChild(tr);shown++;
    });
    statsBar.textContent="显示 "+shown+" 项";
    return;
  }else{
    thead.innerHTML="<th>序号<button type=\"button\" data-action=\"copy-ids\" title=\"复制\" style=\"margin-left:6px;padding:2px 6px;border:1px solid #c8d3e8;background:#eaf2ff;color:#1a73e8;border-radius:4px;cursor:pointer;font-size:.7rem;vertical-align:middle;line-height:1.4\">📋 复制</button></th><th>关键词</th><th>造句</th><th>状态</th><th>上传方</th>";
    const tbody=document.getElementById("statusTbody");tbody.innerHTML="";
    const docMap={};
    allDocs.forEach(d=>{const key=(d.filename||"").replace(/\.[^.]+$/,"").replace(/^.*[/\\]/,"");docMap[key]=d;});
    const searchQ=(document.getElementById("imgSearch")||{value:""}).value.trim().toLowerCase();
    let shown=0;
    const sentenceSource=currentProjectMeta&&currentProjectMeta.table;
    if(!sentenceSource){
      thead.innerHTML='';
      document.getElementById('statusTbody').innerHTML='<tr><td colspan="5" style="text-align:center;padding:30px;color:#888">表格未导入，请先点击「导入表格」上传数据。</td></tr>';
      statsBar.textContent='';
      return;
    }
    Object.keys(sentenceSource).sort().forEach(key=>{
      const item=docMap[key];const row=sentenceSource[key];
      const ist=item?itemStatus(item):"none";
      if(activeFilter!=="all"&&activeFilter!==ist)return;
      if(searchQ&&!key.includes(searchQ)&&!row.kw.includes(searchQ)&&!(item&&(item.filename||"").toLowerCase().includes(searchQ)))return;
      const c=stColors[ist]||stColors.none;
      const stText=ist==="none"?"未上传":statusLabel(ist);
      const tr=document.createElement("tr");
      tr.innerHTML='<td style="color:#888;font-size:.8rem">'+key+'</td><td style="font-weight:700">'+row.kw+'</td><td style="font-size:.78rem;color:#555;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+row.s+'">'+row.s+'</td><td><span class="st-badge" style="background:'+c.bg+';color:'+c.fg+'">'+stText+'</span></td><td style="font-size:.75rem;color:#888">'+(item?(item.replaced_by||item.uploader||""):"")+'</td>';
      if(item){tr.style.cursor="pointer";tr.addEventListener("click",()=>openModal(item,allDocs));}
      tbody.appendChild(tr);shown++;
    });
    statsBar.textContent="显示 "+shown+" 项";
  }
}
document.addEventListener("click",function(e){
  const t=e.target.closest('[data-action="copy-ids"]');
  if(t){e.preventDefault();e.stopPropagation();console.log("[copy-ids] click event triggered");copyIds();}
});
document.querySelectorAll(".view-btn").forEach(btn=>btn.addEventListener("click",()=>setView(btn.dataset.view)));
document.querySelectorAll(".filter-bar button[data-filter]").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".filter-bar button[data-filter]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");activeFilter=btn.dataset.filter;if(currentView==="table")renderTable();else renderGrid();});});
document.getElementById("chkSelectMode").addEventListener("change",e=>{selectModeOn=e.target.checked;if(!selectModeOn){selectedIds.clear();document.getElementById("chkSelectAll").checked=!1;}renderGrid();updateBatchCount();});
document.getElementById("chkSelectAll").addEventListener("change",e=>{if(e.target.checked)getFiltered().forEach(i=>selectedIds.add(i.id));else selectedIds.clear();renderGrid();updateBatchCount();});
document.getElementById("btnBatchDownload").addEventListener("click",async()=>{
  if(!selectedIds.size){alert("请先勾选图片");return;}
  const ids=[...selectedIds];
  const btn=document.getElementById("btnBatchDownload");
  const origText=btn.textContent;
  try{
    const JSZip=(await import("https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm")).default;
    const zip=new JSZip();
    const CONCURRENCY=3;
    let done=0;
    btn.disabled=true;
    const update=()=>{btn.textContent=`打包中 ${done}/${ids.length}…`;};
    update();
    // Batch concurrent upload
    for(let i=0;i<ids.length;i+=CONCURRENCY){
      const batch=ids.slice(i,i+CONCURRENCY);
      await Promise.all(batch.map(async id=>{
        const item=allDocs.find(d=>d.id===id);if(!item)return;
        try{
          const r=await fetch(item.url);
          const b=await r.blob();
          zip.file(item.filename||id+".png",b);
        }catch(e){console.warn("Skipped",item.filename,e);}
        done++;update();
      }));
    }
    btn.textContent="生成 ZIP…";
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:1}});
    const a=document.createElement("a");const u=URL.createObjectURL(blob);a.href=u;a.download="picreview_"+Date.now()+".zip";a.click();URL.revokeObjectURL(u);
  }catch(err){alert("打包失败："+err.message);}
  finally{btn.disabled=false;btn.textContent=origText;}
});
document.getElementById("btnBatchDelete").addEventListener("click",async()=>{
  if(currentRole!=="uploader")return;
  if(!selectedIds.size){alert("请先勾选图片");return;}
  if(!confirm("确定删除选中的 "+selectedIds.size+" 张？"))return;
  for(const id of[...selectedIds])await sb.from("images").delete().eq("id",id);
  selectedIds.clear();renderGrid();updateBatchCount();
});

// Modal
const modal=document.getElementById("modal"),modalImg=document.getElementById("modalImg"),modalFilename=document.getElementById("modalFilename"),modalUploader=document.getElementById("modalUploader"),commentInput=document.getElementById("commentInput"),commentsList=document.getElementById("commentsList"),btnApprove=document.getElementById("btnApprove"),btnReject=document.getElementById("btnReject"),btnDelete=document.getElementById("btnDelete"),modalClose=document.getElementById("modalClose"),replaceSection=document.getElementById("replaceSection"),replaceInput=document.getElementById("replaceInput"),replaceBtn=document.getElementById("replaceBtn"),replaceStatus=document.getElementById("replaceStatus"),btnPrev=document.getElementById("btnPrev"),btnNext=document.getElementById("btnNext"),navCounter=document.getElementById("navCounter"),modalClaimPin=document.getElementById("modalClaimPin"),btnClaim=document.getElementById("btnClaim"),btnUnclaim=document.getElementById("btnUnclaim"),btnRename=document.getElementById("btnRename");
let selectedTags=[],currentDocId=null,currentList=[],currentIndex=-1;
function openModal(item,list){currentList=list||getFiltered();currentIndex=currentList.findIndex(d=>d.id===item.id);loadItem(item);modal.classList.add("open");}
function loadItem(item){
  buildClaimColorMap();
  currentDocId=item.id;selectedTags=[];modalImg.src=imgMid(item.url);modalFilename.textContent=item.filename||"Image";
  btnRename.style.display=currentRole==="uploader"?"inline":"none";
  const modalSentence=document.getElementById("modalSentence");
  const fnKey=(item.filename||"").replace(/\.[^.]+$/,"").replace(/^.*[/\\]/,"");
  const isWordCard=currentProjectName&&currentProjectName.includes("English word cards");
  if(isWordCard){
    let kw="",zh="";
    const rows=currentProjectMeta?.table?.rows;
    if(rows){
      const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      let row=rows[fnKey];
      if(!row)row=Object.entries(rows).find(([id])=>norm(id)===norm(fnKey))?.[1];
      if(!row){const m=fnKey.match(/^(\d+)/);if(m){row=rows[m[1]]||Object.entries(rows).find(([id])=>id.startsWith(m[1]))?.[1];}}
      if(row)kw=row[0]||"";
    }
    const id4=(fnKey.match(/^(\d{4})/)||[])[1];
    if(id4&&WORD_MAP[id4]){if(!kw)kw=WORD_MAP[id4].kw;zh=WORD_MAP[id4].zh||"";}
    if(kw||zh){
      modalSentence.textContent=(kw?"关键词："+kw:"")+(kw&&zh?" · ":"")+(zh?"中文："+zh:"");
      modalSentence.style.display="block";
    }else{modalSentence.style.display="none";}
  }else{
    const csvRow=(currentProjectMeta&&currentProjectMeta.table&&currentProjectMeta.table.rows&&currentProjectMeta.table.rows[fnKey])||null;
    if(csvRow){
      const kw2=csvRow[0]||'';const s2=csvRow[1]||'';
      modalSentence.textContent=(kw2?'关键词：'+kw2:'')+(kw2&&s2?' · ':'')+(s2?'造句：'+s2:'');
      modalSentence.style.display='block';
    }else{modalSentence.style.display='none';}
  }
  modalUploader.textContent="上传方："+(item.replaced_by||item.uploader||"—")+"  |  状态："+statusLabel(itemStatus(item))+(item.claimed_by?"  |  认领："+item.claimed_by:"");
  commentInput.value="";replaceStatus.textContent="";commentInput.style.border="";
  document.querySelectorAll(".tag").forEach(t=>t.classList.remove("selected"));
  if(item.claimed_by){applyClaimPin(modalClaimPin,item.claimed_by);modalClaimPin.classList.add("show");}
  else{modalClaimPin.innerHTML="";modalClaimPin.style.background="";modalClaimPin.style.color="";modalClaimPin.classList.remove("show");}
  if(currentRole==="reviewer"&&item.status==="rejected"){
    btnClaim.textContent=item.claimed_by?"抢夺认领":"我来改！";
    btnClaim.style.display="inline-block";
    btnUnclaim.style.display=item.claimed_by?"inline-block":"none";
  }else{btnClaim.style.display="none";btnUnclaim.style.display="none";}
  commentsList.innerHTML="";
  (item.comments||[]).slice().reverse().forEach(c=>{const div=document.createElement("div");div.className="comment-item";const claimMark=c.type==="claim"?' <span style="color:#e65100;font-weight:700">[认领]</span>':"";div.innerHTML='<div class="meta">'+c.user+" · "+fmt(c.time)+claimMark+(c.action==="approved"?" ✅":"")+(c.action==="rejected"?" ❌":"")+'</div>'+(c.text||"")+(c.tags&&c.tags.length?'<div style="margin-top:3px">'+c.tags.map(t=>'<span class="badge badge-pending">'+t+'</span>').join(" ")+'</div>':"");commentsList.appendChild(div);});
  replaceSection.style.display=(currentRole==="uploader"&&item.status==="rejected")?"block":"none";
  btnPrev.disabled=currentIndex<=0;btnNext.disabled=currentIndex>=currentList.length-1;
  navCounter.textContent=(currentIndex+1)+" / "+currentList.length;
}
function navigate(dir){const ni=currentIndex+dir;if(ni<0||ni>=currentList.length)return;currentIndex=ni;loadItem(currentList[ni]);}
btnPrev.addEventListener("click",()=>navigate(-1));
btnNext.addEventListener("click",()=>navigate(1));
document.addEventListener("keydown",e=>{if(!modal.classList.contains("open"))return;if(e.key==="ArrowLeft")navigate(-1);if(e.key==="ArrowRight")navigate(1);if(e.key==="Escape")closeModal();});
modalClose.addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
function closeModal(){modal.classList.remove("open");currentDocId=null;document.getElementById("reviewToast").classList.remove("show");}
function showReviewToast(status){
  const t=document.getElementById("reviewToast");
  t.textContent=status==="approved"?"已通过":"已打回";
  t.className=status;
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove("show"),2500);
}
document.querySelectorAll(".tag").forEach(t=>{t.addEventListener("click",()=>{t.classList.toggle("selected");const tag=t.dataset.tag;if(selectedTags.includes(tag))selectedTags=selectedTags.filter(x=>x!==tag);else selectedTags.push(tag);});});
btnClaim.addEventListener("click",async()=>{
  if(!currentDocId||currentRole!=="reviewer")return;
  const item=allDocs.find(d=>d.id===currentDocId);if(!item)return;
  if(item.claimed_by&&item.claimed_by!==currentUser){if(!confirm("已由「"+item.claimed_by+"」认领，确定抢夺？"))return;}
  const nc=[...(item.comments||[])];nc.push({user:currentUser,text:"我来改！",type:"claim",time:new Date().toISOString()});
  const now=new Date().toISOString();
  await sb.from("images").update({claimed_by:currentUser,claimed_at:now,comments:nc,updated_at:now}).eq("id",currentDocId);
  loadItem({...item,claimed_by:currentUser,claimed_at:now,comments:nc});
});
btnUnclaim.addEventListener("click",async()=>{
  if(!currentDocId||currentRole!=="reviewer")return;
  const item=allDocs.find(d=>d.id===currentDocId);if(!item||!item.claimed_by)return;
  const now=new Date().toISOString();
  await sb.from("images").update({claimed_by:null,claimed_at:null,updated_at:now}).eq("id",currentDocId);
  loadItem({...item,claimed_by:null,claimed_at:null});
});
btnApprove.addEventListener("click",async()=>{if(currentDocId)await submitReview("approved","");});
btnReject.addEventListener("click",async()=>{if(!currentDocId)return;const reason=commentInput.value.trim();if(!reason&&!selectedTags.length){commentInput.style.border="2px solid red";commentInput.placeholder="打回时请填写原因或选择标签";return;}commentInput.style.border="";await submitReview("rejected",reason||selectedTags.join(", "));});
async function submitReview(status,rejectReason){
  const comment=commentInput.value.trim();const item=allDocs.find(d=>d.id===currentDocId);if(!item)return;
  const nc=[...(item.comments||[])];
  if(comment||selectedTags.length)nc.push({user:currentUser,text:comment,tags:[...selectedTags],time:new Date().toISOString(),action:status});
  const now=new Date().toISOString();
  const updated={...item,status,reject_reason:status==="rejected"?rejectReason:"",tags:[...selectedTags],comments:nc,reviewed_by:currentUser,updated_at:now};
  await sb.from("images").update({status,reject_reason:updated.reject_reason,tags:updated.tags,comments:nc,reviewed_by:currentUser,updated_at:now}).eq("id",currentDocId);
  const ai=allDocs.findIndex(d=>d.id===currentDocId);
  if(ai>=0)allDocs[ai]=updated;
  if(currentList[currentIndex]?.id===currentDocId)currentList[currentIndex]=updated;
  loadItem(updated);
  renderGrid();
  showReviewToast(status);
}
btnDelete.addEventListener("click",async()=>{if(!currentDocId)return;if(!confirm("删除这张图片？"))return;await sb.from("images").delete().eq("id",currentDocId);closeModal();});
replaceBtn.addEventListener("click",async()=>{
  const f=replaceInput.files[0];if(!f){replaceStatus.textContent="请先选择文件";return;}
  replaceStatus.textContent="上传中…";
  const hash=await hashFile(f);
  let j;try{j=await cldUpload(f);}catch(err){replaceStatus.textContent="失败："+err.message;return;}
  await sb.from("images").update({url:j.secure_url,storage_path:j.public_id,file_hash:hash,status:"pending",tags:[],updated_at:new Date().toISOString(),uploader:currentUser,replaced_by:currentUser,claimed_by:null,claimed_at:null}).eq("id",currentDocId);
  replaceStatus.textContent="替换成功！";replaceInput.value="";setTimeout(closeModal,1200);
});
btnRename.addEventListener("click",async()=>{
  if(!currentDocId||currentRole!=="uploader")return;
  const item=allDocs.find(d=>d.id===currentDocId);if(!item)return;
  const oldName=item.filename||"";
  const newName=(prompt("新文件名：",oldName)||"").trim();
  if(!newName||newName===oldName)return;
  await sb.from("images").update({filename:newName,updated_at:new Date().toISOString()}).eq("id",currentDocId);
  item.filename=newName;
  loadItem(item);
});
function fmt(iso){if(!iso)return"";const d=new Date(iso);return(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
</script>
