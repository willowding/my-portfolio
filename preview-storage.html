svg.appendChild(mk("line", { x1: retireX, x2: retireX, y1: y0, y2: y1, stroke: "#6f7a6e", "stroke-width": "1.2", "stroke-dasharray": "4 3", "stroke-opacity": "0.85" }));
const rt = mk("text", { x: retireX + 6, y: y0 + 12, "font-size": "11", "font-style": "italic", "font-weight": "600", "letter-spacing": "0.06em", fill: "#6f7a6e" });
rt.textContent = "实习结束";
svg.appendChild(rt);

// end dot
const last = points[points.length-1];
svg.appendChild(mk("circle", { cx: xAt(last.date), cy: yAt(last.total), r: "3.5", fill: "#2d4a3e", stroke: "#faf9f7", "stroke-width": "1.5" }));
const end = mk("text", { x: xAt(last.date) - 8, y: yAt(last.total) - 10, "text-anchor": "end", "font-size": "12", "font-style": "italic", "font-weight": "600", fill: "#2d4a3e", "letter-spacing": "0.02em" });
end.textContent = `${last.total.toLocaleString()} 张 · 截至 ${last.date}`;
svg.appendChild(end);
</script>
