    metrics:
      - { label: "FORMAT", value: "纪录短片" }
      - { label: "AWARD", value: "全国 300 件" }
      - { label: "ROLE", value: "Solo" }

    summary: "学院第一次制作此类视频，从脚本到拍摄剪辑全流程独立完成。影片以「奉献」为题，从「我们做了什么」讲到「志愿者收获了什么」，最终将两者拧成同一个词：我们。"
    summary_en: "The first video of its kind for the school — all scripting, filming and editing were completed independently. Titled \"Dedication\", the film traces the arc from \"what we did\" to \"what the volunteers gained\", ultimately fusing the two into a single word: we."

    bullets:
      - lead: "立项"
        lead_en: "Setup"
        text: "学院拾光志愿服务队的日常是活动素材拍摄和双语课程设计。活动最后一天队长提议做总结视频，由我当天写出脚本；为支撑全片升华点，与队员确认后加拍了一组个人采访。"
        text_en: "My role in the Shiguang volunteer team was capturing activity footage and designing bilingual courses. On the last day, the team lead proposed a recap video, and I wrote the script that same day. To support the film's closing beat, I confirmed with teammates and shot an extra set of individual interviews."
        tags: [context]
      - lead: "脚本"
        lead_en: "Script"
        text: "全片分三幕：①「我们做了什么」——辅导作业、专业宣讲、民歌博物馆参观、志愿者与小朋友互动；②「志愿者收获了什么」——见证孩子成长、因奉献而幸福、收获沟通与团队协作能力；③「志愿者也叫我们」——引用寄语，以校园树荫大道收尾，升华主题。"
        text_en: "The film unfolds in three acts: ① What we did — tutoring, professional talks, folk-song museum visit, volunteer-child interactions; ② What volunteers gained — witnessing growth, finding happiness through dedication, gaining communication and teamwork skills; ③ We are all volunteers — a leader's message as the closing, with the campus tree-lined avenue as backdrop."
        tags: [script, creative-direction]
      - lead: "执行"
        lead_en: "Execution"
        text: "手机拍摄，剪映剪辑。涵盖 4 段辅导片段、3 场专业宣讲（防骗/口腔/急救）、非遗民俗采集、4 类互动场景，以及 9 段志愿者采访。"
        text_en: "Shot on phone, edited in Jianying (CapCut CN). 4 tutoring clips, 3 professional talks (anti-fraud / oral health / first aid), intangible cultural heritage footage, 4 interaction scenes, and 9 volunteer interview segments."
        tags: [process, filming, editing]
      - lead: "获奖"
        lead_en: "Recognition"
        text: "作品《实践一同行，七彩暖童心》入选 **「大我青春」2023 暑期社会实践成果征集展示活动 · 实践风采类优秀作品（全国 300 件）**，由教育部 · 中国大学生在线主办；全流程由个人独立完成。"
        text_en: "Selected as one of the **Top 300 works** in the Ministry of Education's \"Great Youth of Ours\" 2023 Summer Social-Practice Showcase (Practice & Vibe category), hosted by China University Online. The full pipeline was delivered solo."
        tags: [award, ministry-of-education]

    tech: ["剪映", "手机拍摄"]
    tech_en: ["Jianying (CapCut CN)", "Phone camera"]
    tags: [video, award, solo, 2023, content, school-project]

