# --------- 代表项目 ---------
projects:
  - name: "小型团队图片审核工具 PicReview"
    name_en: 'Team Image Review Tool "PicReview" · Build (Solo)'
    period: "2026/05 至今"
    period_en: "May 2026 - Present"
    role: ""
    role_en: ""
    link: "/demo/picreview/index.html"
    link_en: "/demo/picreview-en/index.html"
    featured_size: "lg"
    category: "产品"
    category_en: "Product"
    badges: ["Vibe Coding", "产品"]
    badges_en: ["Vibe Coding", "Product"]
    featured: false

    metrics:
      - { label: "DAILY USERS", value: "7" }
      - { label: "IMAGES REVIEWED", value: "1,674" }
      - { label: "PROJECTS", value: "7" }

    summary: "面向团队内部审图流程的轻量协同工具，从需求定义、原型实现到上线运维独立完成；以「简洁 UI + 完全按团队需求定制」为原则，需求一句话过来当晚即可上线。"
    summary_en: "A lightweight in-team tool for the image review workflow, taken solo from requirement definition through prototype, launch, and ongoing maintenance. Built around \"minimal UI + tailored entirely to the team's needs\" — a one-line request from the team can ship the same evening."

    bullets:
      - lead: "痛点"
        lead_en: "Problem"
        text: "团队审图流程长期存在两处协作摩擦：(1) 实习生无坚果云权限，反复改稿只能在飞书消息里来回，缺乏在线同步；(2) 坚果云中图片被打回即删除，其他成员无法看到打回理由与历史版本，无法真正实现多人并行审核。"
        text_en: "The team's review flow had two persistent friction points: (1) interns had no access to Jianguoyun (the network drive), so revisions ping-ponged in Feishu chats with no real online sync; (2) on Jianguoyun, a rejected image was deleted on the spot — other members could see neither the rejection reason nor the version history, making concurrent review impossible."
        tags: [problem, collaboration-friction]

      - lead: "措施"
        lead_en: "Solution"
        text: "从 0 设计并上线 **PicReview**：以「待审核 → 已打回 → 待审核 → 已通过」为最小状态闭环，**「已认领」按设计主管反馈升级为独立状态**；打回理由直接作为图片下评论沉淀，最新评论一眼可见；**卡片 / 表格双视图**支持快速浏览与整体盘点。"
        text_en: "Designed and shipped **PicReview** from zero: a minimum-loop state machine of \"Pending → Rejected → Pending → Approved\", with **\"Claimed\" promoted into a full state per Design Lead feedback**; rejection reasons live as comments under each image with the latest one always visible; **dual card / table views** support both quick browsing and one-screen status overview."
        tags: [solution, state-machine, dual-view, ownership]

      - lead: "效果"
        lead_en: "Impact"
        text: "开会无需再「投屏展示 + 飞书记录」双线作业，所有审核动作收束到工具内；状态可视化无需再额外维护飞书表格；实习期间用户由 3 人（设计 + 设计主管 + 我）自然扩展至 **7 人**（2 名 PM + 1 名设计主管 + 3 名设计 + 我）日常使用；目前已稳定支撑 **7 个项目（含 1 个已完结）、累计 1674 张图片** 的审核流转。"
        text_en: "Meetings no longer required dual-tracking (screen-share + Feishu notes) — every review action is captured inside the tool; status is visualized natively, so no parallel Feishu sheet is needed; daily users grew from 3 (a designer, the Design Lead, and me) to **7** (2 PMs + 1 Design Lead + 3 designers + me) during my internship; by the end of my internship it was supporting **7 projects (1 completed) and 1,674 images** in active review."
        tags: [impact, adoption, single-source-of-truth]

    tech: ["HTML/CSS/JS（单文件）", "Supabase", "Cloudinary", "GitHub Pages"]
    tech_en: ["HTML/CSS/JS (single-file)", "Supabase", "Cloudinary", "GitHub Pages"]
    tags: [featured, vibecoding, 0-to-1, saas, product, ownership, internal-tool]

